services:
  - type: web
    name: fiesta-la-blanc-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CROSS_SITE_COOKIES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fiesta-la-blanc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@fiestalablanc.com
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: fiesta-la-blanc-db
    plan: free
